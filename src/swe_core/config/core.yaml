agent:
  system_template: |
    You are a helpful assistant that can interact with a computer.

  instance_template: |
    Please solve this issue: {{ task }}

    You can execute bash commands and edit files to implement the necessary changes.

    ## Recommended Workflow

    This workflow should be done step-by-step so that you can iterate on your changes and any possible problems.

    1. Analyze the codebase by finding and reading relevant files
    2. Create a script or use the existing tests to reproduce the issue
    3. Edit the source code to resolve the issue
    4. Verify your fix works by running the reproduction or tests again
    5. Test edge cases to ensure your fix is robust
    6. Submit your changes and finish your work by issuing the following command:
       `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`

       Do not combine it with any other command.
       <important>After this command, you cannot continue working on this task.</important>

    ## Command Execution Rules

    You are operating in an environment where:

    1. You issue at least one command
    2. The system executes the command(s) in a subshell
    3. You see the result(s)
    4. You write your next command(s)

    Each response should include:

    1. Reasoning text explaining your current analysis and plan
    2. At least one bash tool call

    ## Critical Requirements

    - Your response MUST include AT LEAST ONE bash tool call.
    - Every action is executed in a new subshell.
    - Directory changes and temporary environment variable changes are not persistent across actions.
    - If you need to work in a specific directory, include `cd /path && ...` in the same command.
    - If you need temporary environment variables, set them in the same command.
    - Do not claim the problem is solved before verifying the result.
    - When the task is complete, execute exactly:
      `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    - Do not combine the submission command with any other command.
    - After submitting, you cannot continue working on the task.

    Example of a correct response:

    <example_response>
    I need to inspect the repository first.

    [Makes bash tool call with {"command": "ls -la"} as arguments]
    </example_response>

    <system_information>
    {{ system }} {{ release }} {{ version }} {{ machine }}
    </system_information>

    ## Useful command examples

    ### Create a file

    ```bash
    cat <<'EOF' > newfile.py
    print("hello")
    EOF
    ```

    ### View part of a file

    ```bash
    nl -ba filename.py | sed -n '10,30p'
    ```

    ### Replace text

    {%- if system == "Darwin" %}
    On macOS, use `sed -i ''` instead of GNU-style `sed -i`.
    {%- endif %}

    ```bash
    sed -i 's/old_string/new_string/g' filename.py
    ```

  step_limit: 0
  cost_limit: 3.0
  wall_time_limit_seconds: 0
  max_consecutive_format_errors: 3
  mode: confirm
  whitelist_actions: []
  confirm_exit: true


environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"


model:
  observation_template: |
    {%- if output.output | length < 10000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %},
      "exception_info": {{ output.exception_info | tojson }}
      {%- endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:5000] | tojson }},
      "output_tail": {{ output.output[-5000:] | tojson }},
      "elided_chars": {{ output.output | length - 10000 }},
      "warning": "Output too long."
      {%- if output.exception_info %},
      "exception_info": {{ output.exception_info | tojson }}
      {%- endif %}
    }
    {%- endif %}

  format_error_template: |
    {% if finish_reason is defined and
          (finish_reason == "length"
           or (finish_reason == "tool_calls" and not has_tool_calls)) -%}

    Your previous response reached the output token limit
    (finish_reason={{ finish_reason }})
    before you produced a valid tool call, so it was cut off.

    Respond more concisely and finish with exactly one bash tool call.

    {%- else -%}

    Tool call error:

    <error>
    {{ error }}
    </error>

    Every response must use the `bash` tool at least once.

    Call the bash tool using arguments in this form:

    {"command": "your_command_here"}

    If the task is complete, issue exactly:

    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT

    Do not combine the submission command with any other command.

    {%- endif %}

  model_kwargs:
    drop_params: true